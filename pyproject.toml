[project]
name = "insect-detect"
version = "2.0.0"
description = "Software for automated insect monitoring with the Insect Detect camera trap."
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
readme = "README.md"
authors = [{name = "Maximilian Sittinger"}]
dependencies = [
    "depthai >=3.9.0,<4",
    "gpiozero >=2.0.1,<3",
    "nicegui >=3.16.0,<4",
    "nmcli >=1.8.0,<2",
    "numpy >=2.5.2,<3",
    "opencv-python-headless >=4.14.0.94,<5",
    "polars >=1.43.2,<2",
    "psutil >=7.2.2,<8",
    "pydantic >=2.13.4,<3",
    "pyyaml >=6.0.3,<7",
    "smbus2 >=0.6.1,<1",
    "zipstream-ng >=1.9.3,<2",
]

[project.scripts]
startup = "insectdetect.startup:main"
capture = "insectdetect.capture:main"
webapp = "insectdetect.webapp:main"

[project.urls]
Documentation = "https://maxsitt.github.io/insect-detect-docs/"
Repository = "https://github.com/maxsitt/insect-detect"
Issues = "https://github.com/maxsitt/insect-detect/issues"

[tool.uv]
package = true

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# Nested 'with' blocks mirror the UI element hierarchy (NiceGUI's documented style)
"src/insectdetect/webapp.py" = ["SIM117"]

[tool.pylint.typecheck]
ignored-modules = ["cv2"]
